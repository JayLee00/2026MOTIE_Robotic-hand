# base 위치 변경에 따른 초기위치 조정 (2026.06.14)
# 조인트명: dual 모델 우측 팔 (right_fr3_joint*). 값은 동일.
home:
  joint_names:
    - right_fr3_joint1
    - right_fr3_joint2
    - right_fr3_joint3
    - right_fr3_joint4
    - right_fr3_joint5
    - right_fr3_joint6
    - right_fr3_joint7
  joint_values:
    - 0.3340
    - -0.3538
    - -0.3452
    - -2.4303
    - -0.9971
    - 1.9485
    - 1.1640

# ── Approach / Place / Grasp 오프셋 ───────────────────────────────────────────
approach_offset_m: 0.10    # 물체 위에서 approach 시작 높이 (m)
place_z_descent_m: 0.15    # HOME EE Z 에서 place 하강 거리 (m, world Z 기준)
grasp_z_offset_m:  0.13    # SAM3 검출 z_top 위에서 실제 파지 목표까지 오프셋 (m, world Z 기준)

# ── EE 자세 보정 (캘리브레이션 오프셋) ─────────────────────────────────────────
ee_correction:
  yaw_deg: -45.0            # 핸드 장착 회전 오프셋 (world Z축 기준, degrees)
  x_offset_m:  0.01         # EE XY 위치 보정 X (world 프레임, m)
  y_offset_m:  0.0          # EE XY 위치 보정 Y (world 프레임, m) — 0으로 설정

# ── 포인트 클라우드 처리 파라미터 ──────────────────────────────────────────────
pointcloud:
  top_z_pct: 30.0           # centroid 계산에 사용할 상위 Z% 포인트 (가장 두꺼운 부분)
  z_top_pct: 95.0           # z_top 계산 percentile (noise/outlier 제거)
