# KISTAR Franka FR3 팔 설정
# 이 파일을 수정하면 robot_executor.py 와 run_topdown_grasp.py 모두 반영됩니다.

# ── MoveIt 계획 파라미터 ────────────────────────────────────────────────────────
planning:
  group_name: right_arm         # dual_fr3_kistar_v2.srdf 의 우측 팔 그룹
  ee_link: right_fr3_link8      # right_arm chain tip_link
  ref_frame: right_fr3_link0    # 우측 팔 베이스 링크(그룹 base_link). grasp.py world_to_base 결과와 일치
  planning_time_sec: 10.0

