# 과일/물체별 EE 보정 오프셋
# 키는 query 문자열과 소문자 변환 후 정확 매칭합니다.
# 없는 항목은 arm.yaml ee_correction 기본값 + grasp_z_offset_m을 사용합니다.
# 가능한 항목 (모두 optional — 없으면 arm.yaml 기본값):
#   yaw_deg         : 핸드 장착 yaw 오프셋 (degrees, world Z 기준)
#   x_offset_m      : EE XY 보정 X (m)
#   y_offset_m      : EE XY 보정 Y (m)
#   grasp_z_offset_m: SAM3 z_top 위 파지 목표 오프셋 (m, world Z 기준)

pear:
  yaw_deg: -45.0
  x_offset_m:  0.01
  y_offset_m: -0.03
  grasp_z_offset_m: 0.13

