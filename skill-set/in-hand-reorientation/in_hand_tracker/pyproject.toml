[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "in_hand_tracker"
version = "0.1.0"
description = "Standalone in-hand object tracking foundation (IO + deprojection), clean-room of the dex_sodering perception stack."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
authors = [{ name = "fruit-manipulation" }]

# Core runtime deps. NOTE: torch / sam2 / pinocchio are intentionally NOT here:
# they are heavy and provided by the host `dexsdr` conda environment. See the
# optional extras below.
dependencies = [
    "numpy",
    "opencv-python",
    "scipy",
    "open3d",
    "pyyaml",
]

[project.optional-dependencies]
# Provided by the dexsdr env in practice; declared as extras so a fresh install
# can opt in. sam2 has no PyPI wheel here, hence it is documented, not pinned.
torch = ["torch"]
fk = ["pin"]          # pinocchio (forward kinematics for the FK ROI option)
# sam2: install from source per the dexsdr environment; not resolvable via PyPI.

[tool.setuptools]
# Single top-level package living one directory up is NOT the case here: this
# pyproject sits inside the package dir, so we map the package explicitly.
packages = [
    "in_hand_tracker",
    "in_hand_tracker.io",
    "in_hand_tracker.calibration",
    "in_hand_tracker.tests",
]
package-dir = { "in_hand_tracker" = "." }

[tool.setuptools.package-data]
in_hand_tracker = ["config/*.yaml"]
